# GPL-3.0-only is accepted for the Slint crates ONLY, not globally, so a future GPL
# dependency reaching the tree through anything other than Slint still fails the gate
# (that is the whole point of --fail). Slint is offered under
# `GPL-3.0-only OR LicenseRef-Slint-Royalty-free-2.0 OR LicenseRef-Slint-Software-3.0`,
# and this project chooses the GPL-3.0-only option (see THIRD_PARTY_NOTICES.md); the OR
# is satisfied as soon as one alternative is accepted, so this per-crate grant is what
# picks that option. Every Slint-family crate carries the same tri-licence; the list is
# deliberately generous (naming a crate not present in a given build is harmless), so a
# renamed or newly-pulled Slint sub-crate does not silently break the build.
[slint]
accepted = ["GPL-3.0-only"]
[slint-build]
accepted = ["GPL-3.0-only"]
[slint-macros]
accepted = ["GPL-3.0-only"]
[i-slint-common]
accepted = ["GPL-3.0-only"]
[i-slint-compiler]
accepted = ["GPL-3.0-only"]
[i-slint-core]
accepted = ["GPL-3.0-only"]
[i-slint-core-macros]
accepted = ["GPL-3.0-only"]
[i-slint-backend-selector]
accepted = ["GPL-3.0-only"]
[i-slint-backend-winit]
accepted = ["GPL-3.0-only"]
[i-slint-backend-linuxkms]
accepted = ["GPL-3.0-only"]
[i-slint-backend-testing]
accepted = ["GPL-3.0-only"]
[i-slint-renderer-femtovg]
accepted = ["GPL-3.0-only"]
[i-slint-renderer-skia]
accepted = ["GPL-3.0-only"]
[i-slint-renderer-software]
accepted = ["GPL-3.0-only"]

# These published crates omit their upstream licence files. Without clarification,
# cargo-about succeeds but emits an MIT template with copyright placeholders.
# Fetch from each package's .cargo_vcs_info.json commit, NOT a branch or a fixed
# override that could silently survive a dependency update. Hashes cover the entire
# upstream files, including attribution. verify-dependency-licenses.ps1 also checks
# the rendered texts: cargo-about 0.9.1 only WARNS when a clarification fails.

# taffy 0.10.1, 639f0acdd20f914f847abffbeaa903d66cae4882 (Visly/stretch origin).
[taffy.clarify]
license = "MIT"
[[taffy.clarify.git]]
path = "LICENSE.md"
checksum = "a7083ef3dd41a65eeb2162c2c091b0082e2724fb4c6ed029b363c7840d244ecd"

# dasp_sample 0.11.0, 97c3bb9b2363c0b46ac1633858bf1054fd02a980.
# cargo-about 0.9.1 does not strip the repository's .git suffix for raw GitHub
# requests. The generator expands @project/ to this checkout's absolute path.
# Keep the local copy exact; its content is also pinned in license-texts.sha256.
[dasp_sample.clarify]
license = "MIT OR Apache-2.0"
[[dasp_sample.clarify.files]]
path = "@project/licenses/dasp_sample-MIT.txt"
license = "MIT"
checksum = "b1d6df41ed3aa96806e74c729444d7c121d90e6660a6aed01d298e03fde475a0"

