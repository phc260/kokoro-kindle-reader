# --- espeak-ng: MODIFIED GPL component (the whole reason binaries are GPLv3) -------------
[[component]]
name = "espeak-ng.dll"
shipped_as = "espeak-ng.dll"
version = "1.52.0 + horse-hoarse revert"
upstream = "https://github.com/espeak-ng/espeak-ng (tag 1.52.0)"
spdx = "GPL-3.0-or-later"
modified = true
modification = "phsource/ph_english_us: phoneme o@ reverted from horse-hoarse merger (upstream 5b01dd86), 2026-07-05; see build-espeak.ps1 and THIRD_PARTY_NOTICES.md section 5(a) notice"
notice = ["licenses/espeak-ng/COPYING", "licenses/espeak-ng/COPYING.APACHE", "licenses/espeak-ng/COPYING.BSD2", "licenses/espeak-ng/COPYING.UCD", "licenses/GPL-3.0.txt"]
corresponding_source = "native-deps/build-espeak.ps1 (patch + build recipe); corresponding-source-vX.Y.Z.zip carries the built modified tree"
provisioned_by = "native-deps/fetch-deps.ps1 -> build-espeak.ps1"
staged_by = "packaging/build-installer.ps1"
sha256_note = "per-build (built with whatever MSVC vswhere -latest finds; not hash-pinned by design)"

[[component]]
name = "espeak-ng-data/"
shipped_as = "espeak-ng-data/"
version = "1.52.0 + horse-hoarse revert (compiled from the modified phsource)"
upstream = "https://github.com/espeak-ng/espeak-ng (tag 1.52.0)"
spdx = "GPL-3.0-or-later AND Unicode-DFS-2016"
modified = true
modification = "derived from the modified phsource above (the o@ revert affects the compiled dictionary data)"
# COPYING.UCD covers the Unicode Character Database data baked into this directory; it is a
# DIFFERENT document from licenses/Unicode-3.0.txt (which is for the unicode-ident crate).
notice = ["licenses/espeak-ng/COPYING", "licenses/espeak-ng/COPYING.UCD", "licenses/GPL-3.0.txt"]
corresponding_source = "native-deps/build-espeak.ps1; corresponding-source-vX.Y.Z.zip"
provisioned_by = "native-deps/fetch-deps.ps1 -> build-espeak.ps1"
staged_by = "packaging/build-installer.ps1"

