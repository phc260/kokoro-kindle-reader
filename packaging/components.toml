# Non-Rust shipped-component manifest (authoritative inventory)
#
# cargo-about (packaging/generate-dependency-licenses.ps1) enumerates the RUST closure
# statically linked into the executables and the x86 DLLs. It cannot see the native DLLs,
# the ONNX models, the SVG assets baked into the panel, or the NSIS installer stub. This
# file is the checked-in record for exactly those non-Rust shipped files, so every byte the
# installer places on disk has a recorded origin + licence somewhere: Rust in the generated
# reports, everything else here.
#
# Per-artifact conveyed-licence reasoning (which binary is GPLv3, which stays MIT, and why)
# lives in LICENSING.md; THIRD_PARTY_NOTICES.md carries the human-readable prose. This is
# the machine-checkable inventory the installer-extraction CI test reads.
#
# Fields per [[component]]:
#   name         - shipped filename or asset group
#   shipped_as   - where it lands in an install (relative to the app dir)
#   version      - upstream version / immutable revision, or "per-build" when not fixed
#   sha256       - digest of the shipped file where it is stable/pinned; omitted for
#                  build-variable outputs (see `sha256_note`)
#   upstream     - canonical source URL
#   spdx         - SPDX licence expression
#   modified     - true if this project alters it (with `modification` describing how)
#   notice       - the licence/notice file(s) shipped for it (install-relative)
#   corresponding_source - where the complete source is, for copyleft components
#   provisioned_by / staged_by - the scripts that fetch and package it

# --- ONNX Runtime (WebGPU) wheel: four redistributed DLLs -------------------------------
# All four come from the onnxruntime-webgpu 1.27.0 Python wheel (pinned in fetch-deps.ps1).
# Their SHA-256 is fixed by that wheel version, not by our build; the wheel pin IS the pin.
# The wheel's own LICENSE / ThirdPartyNotices.txt / Privacy.md ship in licenses/onnxruntime/.

[[component]]
name = "onnxruntime.dll"
shipped_as = "onnxruntime.dll"
version = "onnxruntime-webgpu 1.27.0 wheel"
upstream = "https://github.com/microsoft/onnxruntime"
spdx = "MIT"
modified = false
notice = ["licenses/onnxruntime/", "THIRD_PARTY_NOTICES.md"]
provisioned_by = "native-deps/fetch-deps.ps1"
staged_by = "packaging/build-installer.ps1"
sha256_note = "fixed by the pinned wheel version; not recomputed here"

[[component]]
name = "onnxruntime_providers_shared.dll"
shipped_as = "onnxruntime_providers_shared.dll"
version = "onnxruntime-webgpu 1.27.0 wheel"
upstream = "https://github.com/microsoft/onnxruntime"
spdx = "MIT"
modified = false
notice = ["licenses/onnxruntime/", "THIRD_PARTY_NOTICES.md"]
provisioned_by = "native-deps/fetch-deps.ps1"
staged_by = "packaging/build-installer.ps1"
sha256_note = "fixed by the pinned wheel version; not recomputed here"

