# Non-Cargo shipped-component manifest (authoritative inventory)
#
# cargo-about (packaging/generate-dependency-licenses.ps1) enumerates the CARGO PACKAGE
# closure statically linked into the executables and the x86 DLLs. It cannot see the Rust
# standard library supplied by the toolchain, the native DLLs, the ONNX models, the SVG
# assets baked into the panel, or the NSIS installer stub. This file is the checked-in
# record for those non-Cargo components, so every byte the installer places on disk has a
# recorded origin + licence somewhere: Cargo packages in the generated reports, everything
# outside that graph here.
#
# Per-artifact conveyed-licence reasoning (which binary is GPLv3, which stays MIT, and why)
# lives in LICENSING.md; THIRD_PARTY_NOTICES.md carries the human-readable prose.
#
# What actually enforces this file (so the inventory can't quietly drift from the tree):
#   - verify-component-hashes.ps1 (run in license-check.yml AND at the top of
#     build-installer.ps1) recomputes the sha256 of every in-repo asset pinned here - the
#     five kokoro-panel/ui/*.svg - fails on a mismatch, AND asserts that set equals the SVGs
#     panel.slint actually compiles in (so a deleted block or an un-inventoried new glyph both
#     fail), so the SVG inventory here cannot drift from the tree.
#   - verify-installer-notices.ps1 (run after the installer build) parses every `notice`
#     field below and asserts each exact file is present and non-empty in the built -setup.exe.
#     It also rejects an unparseable field, a component without exactly one field, or a
#     directory-level notice path, so this manifest and the extraction proof cannot drift.
# The ORT DLLs / OCR models carry a sha256_note instead: ORT is pinned by one exact wheel
# SHA-256 and the OCR assets by ocr-manifest.json, not recomputed here.
#
# Fields per [[component]]:
#   name         - shipped filename or asset group
#   shipped_as   - where it lands in an install (relative to the app dir)
#   version      - upstream version / immutable revision, or "per-build" when not fixed
#   sha256       - digest of the shipped file where it is stable/pinned; omitted for
#                  build-variable outputs (see `sha256_note`)
#   upstream     - canonical source URL
#   spdx         - SPDX licence expression
#   modified     - true if this project alters it (with `modification` describing how)
#   notice       - exact install-relative licence/notice file(s) shipped for it; directory
#                  paths are forbidden because the extraction proof checks individual files
#   corresponding_source - where the complete source is, for copyleft components
#   provisioned_by / staged_by - the scripts that fetch and package it

# --- Rust standard library: statically linked, invisible to cargo-about -----------------
# Every Rust output includes the target's precompiled std/core/alloc/compiler-builtins from
# the active rustc sysroot. The exact licence composition changes with the toolchain and
# includes bundled source dependencies, so do not duplicate it as a hand-maintained SPDX
# list. LicenseRef-Rust-Standard-Library-Per-Build denotes Rust's own generated, exhaustive
# COPYRIGHT-library.html staged from that same sysroot; TOOLCHAIN.txt records the release and
# immutable commit. The corresponding-source archive carries that toolchain's rust-src
# `library/` tree in full.
[[component]]
name = "Rust Standard Library (statically linked into all five Rust outputs)"
shipped_as = "compiled into kokoro-host.exe, kokoro-panel.exe, KokoroSapi.dll, kokoro_hook.dll, and kokoro-inject.exe"
version = "per-build stable toolchain (exact release and commit in licenses/rust/TOOLCHAIN.txt)"
upstream = "https://github.com/rust-lang/rust"
spdx = "LicenseRef-Rust-Standard-Library-Per-Build"
modified = false
notice = ["licenses/rust/COPYRIGHT-library.html", "licenses/rust/TOOLCHAIN.txt", "THIRD_PARTY_NOTICES.md"]
corresponding_source = "corresponding-source-X.Y.Z.zip carries the exact rust-src library tree from this toolchain"
provisioned_by = "the active rustc sysroot"
staged_by = "packaging/build-installer.ps1"

