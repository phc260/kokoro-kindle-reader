[project]
name = "kokoro-stack-check"
version = "0.1.0"
description = "Tech-stack + CPU/GPU speed diagnostic for the Kokoro synth stack (not part of the product)."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2",
    # onnxruntime-webgpu bundles the same `onnxruntime` module PLUS the WebGPU EP (Dawn ->
    # D3D12 on Windows, Vulkan on Linux) and the CPU EP. Pinned to 1.27.0 to match the
    # project's Windows build. On an integrated GPU the WebGPU EP runs but is slower than CPU;
    # the Speed test measures it.
    "onnxruntime-webgpu==1.27.0",
    # Only for the "wrap sine phase" toggle: inserts four nodes before the harmonic source's
    # Sin so WebGPU's Sin never sees an argument outside [0, 2*pi). See wrap_sine_phase().
    "onnx>=1.16",
    # The GUI toolkit, as in production's kokoro-panel. Pinned to the Python release of the
    # Slint version the panel locks (Rust slint 1.17.1); the "b" marks the Python bindings as
    # beta, not the runtime.
    "slint==1.17.1b2",
]

[tool.uv]
# Not an installable package -- two flat modules plus ui/stack_check.slint, driven by uv run.
package = false
# A reproducible interpreter regardless of the OS or distro: the Linux laptop's system Python
# ships without pip/ensurepip, and uv's managed CPython is the same everywhere this runs.
python-preference = "only-managed"
# The venv usually sits on a different volume from uv's wheel cache (a fuse mount on the Linux
# laptop, D: against a C: cache on the Windows box), and hardlinks can't cross volumes -- so
# copy the cached wheels instead.
link-mode = "copy"
