name: License check (cargo-about gate)

# Runs the cargo-about --fail gate (the same one build-installer.ps1 runs) on pull requests
# that could change the licence closure, so a dependency under a licence not in
# packaging/about.toml's `accepted` list is caught at review time - not only on a release
# tag. This does NOT build the installer or the native deps; it only resolves and renders
# the Cargo dependency-licence notices, which is what the gate needs.

on:
  pull_request:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.gitattributes'
      - 'packaging/about.toml'
      - 'packaging/about.hbs'
      # The checks are Python; the .ps1 beside each one is a harness its callers still use.
      - 'packaging/generate_dependency_licenses.py'
      - 'packaging/verify_dependency_licenses.py'
      - 'packaging/test_dependency_licenses.py'
      - 'packaging/source_notices.py'
      - 'packaging/dotnet_compat.py'
      - 'packaging/generate-dependency-licenses.ps1'
      - 'packaging/verify-dependency-licenses.ps1'
      - 'packaging/test-dependency-licenses.ps1'
      - 'packaging/python3.ps1'
      - 'packaging/source-notices.json'
      - 'legal.html'
      - 'legal.rs'
      - 'packaging/components.toml'
      - 'packaging/verify-component-hashes.ps1'
      - 'packaging/license-texts.sha256'
      - 'packaging/verify-license-texts.ps1'
      - 'packaging/verify-license-texts.py'
      # The installer/staging/notice-verifier/corresponding-source scripts control what ships;
      # touching them re-runs this gate at review time (the full extraction proof still runs on
      # the tag build in installer.yml, which needs the built -setup.exe).
      - 'packaging/build-installer.ps1'
      - 'packaging/installer.nsi'
      - 'packaging/verify_installer_notices.py'
      - 'packaging/target_platform.py'
      - 'packaging/verify-installer-notices.ps1'
      - 'packaging/build-corresponding-source.ps1'
      - 'THIRD_PARTY_NOTICES.md'
      - 'LICENSING.md'
      - 'LICENSE'
      - 'licenses/**'
      - 'native-deps/**'
      - 'kokoro-panel/ui/*.svg'
      - '.github/workflows/installer.yml'
      - '.github/workflows/license-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-about:
    name: cargo-about gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # Every check below is a Python script behind a .ps1 harness. windows-latest happens
      # to ship a Python, but pin one rather than depend on a runner image: "the image
      # changed" is not a failure anyone wants to diagnose from a licence gate.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc # the x86 crates resolve a different graph

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            kokoro-host
            kokoro-panel
            kokoro-sapi
            kokoro-hook
            kokoro-inject

      # Pinned to match the release pipeline (installer.yml).
      - name: Install cargo-about (pinned)
        run: cargo install cargo-about --version 0.9.1 --locked --features cli

      # Generates one report per shipped (crate, target) pair and, via --fail, refuses any
      # crate whose resolved licence is not accepted for it in about.toml. A new licence
      # category (or GPL arriving through anything other than Slint) fails this job.
      - name: Run the licence gate
        shell: pwsh
        run: ./packaging/generate-dependency-licenses.ps1

      # The checks are Python, but keep driving them through the harness under Windows
      # PowerShell 5.1: that is how CI and a developer invoke them, and it is the harness's
      # App-Execution-Alias resolution that this proves still works.
      - name: Test notice-verification regressions (via the PowerShell 5.1 harness)
        shell: powershell
        run: ./packaging/test-dependency-licenses.ps1

      # Verify the in-repo assets pinned in components.toml (the five Material Symbols SVGs
      # compiled into kokoro-panel.exe) still hash to their recorded sha256 - so the non-Cargo
      # inventory can't silently drift from the tree.
      - name: Verify component hashes
        shell: pwsh
        run: ./packaging/verify-component-hashes.ps1

      # A present, non-empty licence file can still be truncated or copied from the wrong
      # upstream revision. Pin the fixed checked-in texts after normalizing CRLF/LF.
      - name: Verify checked-in licence texts
        shell: pwsh
        run: ./packaging/verify-license-texts.ps1
