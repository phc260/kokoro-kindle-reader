name: debian installer (Linux host build + tests + .deb)

# The Ubuntu half of the host. This is the only place the Linux build is actually
# LINKED and RUN -- development happens on Windows, where `cargo check
# --target x86_64-unknown-linux-gnu` proves the cfg gating compiles and nothing more.
# Everything that check cannot see lives past it: whether libespeak-ng.so actually
# provides the symbols espeak.rs declares, whether the $ORIGIN rpath resolves, whether
# the provisioned ONNX Runtime loads on a real glibc. So this job provisions for real
# and builds for real.
#
# It does NOT narrate: that needs the model (~325 MB, downloaded by the panel at first
# run) and an audio device. The synth is exercised by the unit tests, which need no
# model, no network and no host.
#
# It then builds the .deb with the same build_installer.py a local Linux build runs,
# verifies the notice tree inside it, installs it and probes the INSTALLED host, and builds
# its corresponding-source archive. The .deb
# links modified espeak-ng (GPL), so it leaves CI only TOGETHER with that archive - one
# artifact holding both, the way windows-installer.yml pairs the installer with its own.

on:
  push:
    paths:
      - 'kokoro-host/**'
      - 'kokoro-ocr/**'
      - 'kokoro-protocol/**'
      - 'native-deps/*.py'
      # What the .deb build reads beyond the host: the packaging scripts and Linux data,
      # the shipped licence texts, and the manifests fetch-model.py ships beside it.
      - 'packaging/**'
      - '!packaging/windows/**'
      - 'licenses/**'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - 'model-manifest.json'
      - 'ocr-manifest.json'
      - '.github/workflows/debian-installer.yml'
  pull_request:
    paths:
      - 'kokoro-host/**'
      - 'kokoro-ocr/**'
      - 'kokoro-protocol/**'
      - 'native-deps/*.py'
      - 'packaging/**'
      - '!packaging/windows/**'
      - 'licenses/**'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - 'model-manifest.json'
      - 'ocr-manifest.json'
      - '.github/workflows/debian-installer.yml'
  workflow_dispatch:

# Read-only: nothing here writes to the repository, and the build runs third-party build
# scripts that should not hold a token that could.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # `lfs: true` for the corresponding-source archive, not the build: nothing on the
      # Linux build path reads an LFS file (the tray icon is the only `include_bytes!` of
      # one, inside a `cfg(windows)` function), but the archive is the whole project
      # source, and it refuses to ship an LFS pointer in place of a file.
      - uses: actions/checkout@v7
        with:
          lfs: true

      # rust-src: the archive carries the exact standard-library source linked into the
      # host, from this toolchain's own copy.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-src

      # espeak-ng is built from source, pinned: a distribution's libespeak-ng is
      # unmodified and probably not 1.52.0, and either difference changes the phonemes.
      # cmake + a C toolchain are all it needs -- the audio/async/mbrola/sonic backends
      # are configured OFF precisely so there is nothing else to install. dpkg-dev is for the
      # .deb (dpkg-shlibdeps derives its Depends:); build-essential pulls it in already, but
      # build_installer.py refuses to run without it, so it is named rather than implied.
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake dpkg-dev

      # The recipe is invoked directly, the same way windows-installer.yml invokes it on Windows -
      # one script, one entry point, no wrappers. build-espeak.py checks out
      # an immutable commit and refuses to build a tree carrying anything but the one
      # documented modification, which it verifies by digest.
      - name: Provision native dependencies
        run: python3 native-deps/fetch-deps.py

      - name: Show what was provisioned
        run: |
          ls -l native-deps/debian/runtime/
          echo '--- ORT provision marker ---'; cat native-deps/debian/runtime/ORT-PROVISION.txt
          echo '--- espeak provision marker ---'; cat native-deps/debian/runtime/ESPEAK-PROVISION.txt

      # The step Windows cannot do. A link failure here is the espeak FFI disagreeing with
      # the library that was actually built.
      - name: Build host
        run: cargo build --manifest-path kokoro-host/Cargo.toml

      - name: Test host
        run: cargo test --manifest-path kokoro-host/Cargo.toml

      - name: Test OCR
        run: cargo test --manifest-path kokoro-ocr/Cargo.toml

      # Proves the staged tree is complete and the $ORIGIN rpath resolves -- i.e. that the
      # binary would run, which no amount of cross-checking on Windows can establish.
      # `ldd` reports "not found" per unresolved library and still exits 0, so the grep is
      # what turns that into a failure.
      - name: Verify the staged runtime resolves
        run: |
          exe=kokoro-host/target/debug/kokoro-host
          ls -l "$(dirname "$exe")"/lib*.so* || true
          echo '--- ldd ---'
          ldd "$exe"
          if ldd "$exe" | grep -q 'not found'; then
            echo 'FAIL: unresolved shared libraries above' >&2
            exit 1
          fi

      # The host is a service with no tray on Linux, so there is no window to wait for: it
      # binds the loopback endpoint and serves. Starting it proves the ONNX Runtime and
      # espeak both LOAD -- the failure mode a build cannot show. It exits non-zero when the
      # endpoint cannot be created, so a clean start is itself the assertion.
      - name: Start the host and probe it
        run: |
          cargo run --manifest-path kokoro-host/Cargo.toml &
          host_pid=$!
          # Wait for ANY http reply, not a successful one: the request below is deliberately
          # unauthenticated, so `curl -f` would fail on the correct answer and spin out the
          # whole timeout. "000" is curl's code for "no response at all".
          code=000
          for _ in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/status || true)"
            # An `if`, not `[ ... ] && break`: Actions runs these steps under `set -e`, and
            # while a failing left-hand side of `&&` is exempt from that, it is the kind of
            # exemption a reader has to look up. This says what it means.
            if [ "$code" != "000" ]; then break; fi
            if ! kill -0 "$host_pid" 2>/dev/null; then
              echo 'FAIL: the host exited before the endpoint answered' >&2
              exit 1
            fi
            sleep 1
          done
          # Unauthenticated: /status without a bearer token must be refused, not served.
          # A 200 here would mean the token check regressed.
          echo "unauthenticated /status -> $code"
          if [ "$code" = "200" ]; then
            echo 'FAIL: /status answered without a token' >&2
            exit 1
          fi
          if [ "$code" = "000" ]; then
            echo 'FAIL: nothing is listening on 8787' >&2
            exit 1
          fi
          kill "$host_pid" 2>/dev/null || true

      # build_installer.py -> generate_dependency_licenses.py THROWS without it, as on
      # Windows. Pinned to match windows-installer.yml.
      - name: Install cargo-about (pinned)
        run: cargo install cargo-about --version 0.9.1 --locked --features cli

      # Release-builds the host, stages it with the provisioned runtime and the notice tree,
      # and packs it with dpkg-deb into packaging/dist/. Its preflight runs the component-hash
      # and licence-text checks, and the cargo-about gate runs while staging the notices.
      - name: Build the .deb
        run: python3 packaging/build_installer.py

      # Opens the built .deb (in pure Python) and fails if any notice the Linux rows of
      # components.toml require is missing or empty - the GPL text must ship WITH the binary.
      - name: Verify the .deb's notices
        run: python3 packaging/verify_installer_notices.py

      # The package's own metadata, so a wrong Depends: or a missing file is readable in
      # the log without downloading the artifact.
      - name: Show the .deb
        run: |
          deb="$(ls packaging/dist/*.deb)"
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"

      # The .deb as a user gets it: installed by apt, started through /usr/bin. Everything
      # above ran the build tree's host; this is the only run of the INSTALLED one, and so the
      # only thing that can say whether the /usr/bin link reaches the bundled libraries. A
      # clean start does not settle that. init_ort only LOGS a failure to load ONNX Runtime,
      # and a system libespeak-ng (unmodified, wrong phonemes) would start just as cleanly as
      # the bundled one. `ldd /usr/bin/kokoro-host` is no evidence either: it takes $ORIGIN
      # from the link's directory, where a real exec takes it from /proc/self/exe
      # (packaging/README.md). So the step reads the RUNNING host's /proc/<pid>/maps and
      # requires both libraries at their installed paths.
      - name: Install the .deb and probe the installed host
        run: |
          # The build tree's host was started on this port above. If anything still answers,
          # a reply below could be ITS reply rather than the installed host's.
          if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/status || true)" != "000" ]; then
            echo 'FAIL: something already answers on 8787, so the probe cannot tell whose reply it gets' >&2
            exit 1
          fi
          sudo apt-get install -y ./packaging/dist/*.deb
          /usr/bin/kokoro-host &
          host_pid=$!
          code=000
          for _ in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/status || true)"
            if [ "$code" != "000" ]; then break; fi
            if ! kill -0 "$host_pid" 2>/dev/null; then
              echo 'FAIL: the installed host exited before the endpoint answered' >&2
              exit 1
            fi
            sleep 1
          done
          echo "unauthenticated /status -> $code"
          if [ "$code" = "200" ]; then
            echo 'FAIL: /status answered without a token' >&2
            exit 1
          fi
          if [ "$code" = "000" ]; then
            echo 'FAIL: nothing is listening on 8787' >&2
            exit 1
          fi
          libs="$(awk 'NF >= 6 && $6 ~ /\.so/ { print $6 }' "/proc/$host_pid/maps" | sort -u)"
          echo '--- shared libraries the installed host has mapped ---'
          echo "$libs"
          for lib in libespeak-ng.so.1 libonnxruntime.so; do
            if ! printf '%s\n' "$libs" | grep -qx "/usr/lib/kokoro-kindle-reader/$lib"; then
              echo "FAIL: the installed host did not load /usr/lib/kokoro-kindle-reader/$lib" >&2
              exit 1
            fi
          done
          kill "$host_pid" 2>/dev/null || true

      # Complete corresponding source (GPLv3 section 6) for the .deb, from this job's own
      # build and provenance. A run on a v* tag must pass the strict clean+matching-tag proof;
      # any other run is not a release, but the upload below still conveys its .deb, so it is
      # paired with a source archive from the same checkout, stamped NON-RELEASE.
      - name: Build corresponding source (release)
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 packaging/build_corresponding_source.py

      - name: Build corresponding source (non-release)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: python3 packaging/build_corresponding_source.py --allow-uncommitted

      # Never the .deb alone: the GPL-covered package and its source travel as one artifact.
      - name: Upload .deb + corresponding source
        uses: actions/upload-artifact@v7
        with:
          name: kokoro-kindle-reader-debian-bundle
          path: |
            packaging/dist/*.deb
            packaging/dist/corresponding-source-*-debian.zip
          if-no-files-found: error
