name: Installer (kokoro-host + panel)

# Builds the installer: the tray host (kokoro-host) + the Slint settings panel
# (kokoro-panel) + the native Dawn WebGPU runtime + the x86 KokoroSapi.dll (Rust),
# packaged by packaging/build-installer.ps1 (makensis). This is the only edition now
# (the old Tauri/WebView2 build is retired), so it owns the vX.Y.Z release tags.
# Windows-only. The synth runtime deps are provisioned by fetch-deps.ps1 (the
# onnxruntime-webgpu wheel for the Dawn runtime DLLs + an espeak-ng x64 build). The Cloud
# Reader OCR models are NOT bundled - the app downloads them at first run - so they are not
# provisioned here. The synth core is pure Rust; onnxruntime.dll is loaded at runtime via
# the `ort` crate, by both the synth and the OCR.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true # icons/icon.ico is in Git LFS (bundled + shortcut icon)

      - name: Set up Python (for the onnxruntime-webgpu wheel)
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc # the x86 SAPI DLL (kokoro-sapi)

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            kokoro-host
            kokoro-panel
            kokoro-sapi
            kokoro-hook
            kokoro-inject

      # NSIS is PINNED: the installer/uninstaller stub is NSIS, so its version is part of
      # what we ship (its COPYING is staged into licenses\nsis\ from this exact toolchain -
      # see build-installer.ps1). Bump this in lockstep when intentionally upgrading NSIS;
      # the value must be a version the choco `nsis` package actually publishes.
      - name: Install NSIS (pinned)
        run: choco install nsis --version=3.11.0 -y --no-progress

      # cargo-about generates the Rust dependency-licence notices and, via `--fail`, is the
      # gate that refuses a dependency under a licence not in packaging\about.toml. Without
      # it here, build-installer.ps1 -> generate-dependency-licenses.ps1 THROWS, so this is
      # a build-breaking prerequisite, not only a compliance step. Pinned so the closure
      # notices are reproducible; --features cli matches how the tool is normally installed.
      - name: Install cargo-about (pinned)
        run: cargo install cargo-about --version 0.9.1 --locked --features cli

      # Provision native-deps/: the Dawn runtime DLLs (from the
      # onnxruntime-webgpu wheel) + an espeak-ng x64 build. Downloads + a build;
      # the slowest step.
      - name: Provision native deps (ORT runtime + espeak)
        shell: pwsh
        run: ./native-deps/fetch-deps.ps1

      # The Cloud Reader OCR models are NOT bundled - the panel downloads them at first run
      # (see ocr-manifest.json / kokoro-panel::download), so the installer build does not need
      # them and no OCR provisioning step runs here.

      # Build the x86 Rust SAPI DLL + release-build both crates, stage, run makensis.
      - name: Build installer
        shell: pwsh
        run: ./packaging/build-installer.ps1

      # Prove the installer actually CONTAINS the licence/notice tree (GPLv3 requires the
      # notices accompany the binaries). Extracts the produced -setup.exe and fails if any
      # required notice is missing or empty - same "fail loudly" contract as the OCR digests.
      - name: Verify installer notices
        shell: pwsh
        run: ./packaging/verify-installer-notices.ps1

      # Complete corresponding source (GPLv3 section 6) for the GPL-covered binaries -
      # attached beside the installer below and linked from the release body.
      - name: Build corresponding source
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: ./packaging/build-corresponding-source.ps1

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: kokoro-kindle-reader-setup
          path: packaging/*-setup.exe
          if-no-files-found: error

      # Release title: match the existing "kokoro-kindle-reader vX.Y.Z" convention
      # (strip the leading v from the tag).
      - name: Compose release title
        if: startsWith(github.ref, 'refs/tags/v')
        id: relname
        shell: bash
        run: echo "title=kokoro-kindle-reader v${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # On a v* tag, also publish a draft GitHub Release. Attach BOTH the installer and the
      # corresponding-source archive: the GPL-covered binaries must be conveyed with their
      # complete corresponding source from the same place (GPLv3 section 6(d)).
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            packaging/*-setup.exe
            packaging/corresponding-source-*.zip
          draft: true
          name: ${{ steps.relname.outputs.title }}
          body: |
            WebView2-free edition of Kokoro Kindle Reader — a headless tray host
            (native Dawn WebGPU synthesis) + a native Slint settings panel.
            Bundles the "Kokoro (SAPI5)" x86 engine so Kindle for PC can narrate.

            The Kokoro model downloads on first run (open Settings from the tray).
            The app must stay running (tray) for Kindle to speak.

            ---
            **Licensing.** The installed application is conveyed under **GPL-3.0-only**
            (it links modified espeak-ng and Slint). Complete corresponding source for the
            GPL-covered binaries is the `corresponding-source-*.zip` attached to this
            release; the licence notices ship inside the installer. See `LICENSING.md` and
            `THIRD_PARTY_NOTICES.md` in the source for the full breakdown.
