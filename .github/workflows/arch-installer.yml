name: arch installer (Linux host build + .pkg.tar.xz)

# The Arch Linux package, built natively on Arch: the same fetch-deps.py provisioning and the
# same build_installer.py as the .deb (debian-installer.yml), which picks the makepkg packager
# from os-release. The binaries are built HERE rather than borrowed from the Ubuntu job:
# makepkg is an Arch tool, and building on the distribution the package is for is what pins
# its glibc floor to Arch's rather than to whatever the Ubuntu runner happened to have.
#
# The host's unit tests and the build tree's start-and-probe check live in debian-installer.yml
# and are not repeated: the source is the same, and this job's question is the PACKAGE's -
# whether it builds, and whether the host it installs starts and loads its bundled libraries.
#
# It then builds the package's own corresponding-source archive and uploads the two together:
# the package links modified espeak-ng (GPL), so it never leaves CI without that source.
#
# makepkg refuses to run as root and a container job runs as root, so everything from
# provisioning on runs as an unprivileged `builder` (the `as-builder` wrapper below).

on:
  push:
    paths:
      - 'kokoro-host/**'
      - 'kokoro-ocr/**'
      - 'kokoro-protocol/**'
      - 'native-deps/*.py'
      # What the package build reads beyond the host: the packaging scripts and Linux data,
      # the shipped licence texts, and the manifests fetch-model.py ships beside it.
      - 'packaging/**'
      - '!packaging/windows/**'
      - 'licenses/**'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - 'model-manifest.json'
      - 'ocr-manifest.json'
      - '.github/workflows/arch-installer.yml'
  pull_request:
    paths:
      - 'kokoro-host/**'
      - 'kokoro-ocr/**'
      - 'kokoro-protocol/**'
      - 'native-deps/*.py'
      - 'packaging/**'
      - '!packaging/windows/**'
      - 'licenses/**'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - 'model-manifest.json'
      - 'ocr-manifest.json'
      - '.github/workflows/arch-installer.yml'
  workflow_dispatch:

# Read-only: nothing here writes to the repository, and the build runs third-party build
# scripts that should not hold a token that could.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Arch is rolling, so there is no version to pin: this is the Arch a user installing the
    # package today has. base-devel brings makepkg, fakeroot, gcc, make and binutils (readelf).
    container: archlinux:base-devel
    steps:
      # Before checkout, because actions/checkout falls back to a REST download without git -
      # and build_installer.py records provenance with `git ls-files`, which needs a real
      # clone. cmake + the C toolchain build espeak-ng from source, as on Ubuntu; rustup
      # provides cargo. git-lfs because the checkout resolves LFS files for the
      # corresponding-source archive, for the reason debian-installer.yml gives.
      - name: Install build tools
        run: |
          pacman -Syu --noconfirm --needed git git-lfs cmake python rustup
          useradd --create-home builder
          printf '#!/bin/sh\nexec runuser -u builder -- env HOME=/home/builder PATH="/home/builder/.cargo/bin:$PATH" "$@"\n' > /usr/local/bin/as-builder
          chmod 0755 /usr/local/bin/as-builder

      - uses: actions/checkout@v7
        with:
          lfs: true

      # The checkout ran as root; the build runs as builder and writes into the tree.
      - name: Hand the checkout to the build user
        run: chown -R builder:builder "$GITHUB_WORKSPACE"

      # rust-src: the source archive carries the exact standard-library source linked in.
      - name: Install the Rust toolchain
        run: as-builder sh -c 'rustup set profile minimal && rustup default stable && rustup component add rust-src'

      - name: Provision native dependencies
        run: as-builder python native-deps/fetch-deps.py

      # build_installer.py -> generate_dependency_licenses.py THROWS without it. Pinned to
      # match windows-installer.yml.
      - name: Install cargo-about (pinned)
        run: as-builder cargo install cargo-about --version 0.9.1 --locked --features cli

      # Release-builds the host, stages it with the provisioned runtime and the notice tree,
      # derives `depends` from the binaries, and has makepkg pack it into packaging/dist/.
      - name: Build the Arch package
        run: as-builder python packaging/build_installer.py

      # Opens the built package (in pure Python) and fails if any notice the Linux rows of
      # components.toml require is missing or empty - the GPL text must ship WITH the binary.
      - name: Verify the package's notices
        run: as-builder python packaging/verify_installer_notices.py

      # The package's own metadata, so a wrong depends or a missing file is readable in the
      # log without downloading the artifact.
      - name: Show the package
        run: |
          pkg="$(ls packaging/dist/*.pkg.tar.xz)"
          pacman -Qip "$pkg"
          pacman -Qlp "$pkg"

      # The package as a user gets it: installed by pacman, started through /usr/bin, run as an
      # ordinary user. Why it reads /proc/<pid>/maps instead of trusting a clean start is in
      # debian-installer.yml's step of the same name. Two differences, both from running the
      # host as builder: runuser forks, so $! is runuser (alive exactly as long as the host)
      # and the host itself is found with pgrep; and the maps are read AS builder, because a
      # container's root has no CAP_SYS_PTRACE and cannot open another user's.
      - name: Install the package and probe the installed host
        run: |
          pacman -U --noconfirm packaging/dist/*.pkg.tar.xz
          as-builder /usr/bin/kokoro-host &
          runuser_pid=$!
          code=000
          for _ in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/status || true)"
            if [ "$code" != "000" ]; then break; fi
            if ! kill -0 "$runuser_pid" 2>/dev/null; then
              echo 'FAIL: the installed host exited before the endpoint answered' >&2
              exit 1
            fi
            sleep 1
          done
          echo "unauthenticated /status -> $code"
          if [ "$code" = "200" ]; then
            echo 'FAIL: /status answered without a token' >&2
            exit 1
          fi
          if [ "$code" = "000" ]; then
            echo 'FAIL: nothing is listening on 8787' >&2
            exit 1
          fi
          host_pid="$(pgrep -u builder -x kokoro-host || true)"
          if [ -z "$host_pid" ]; then
            echo 'FAIL: the installed host answered and then exited' >&2
            exit 1
          fi
          libs="$(as-builder awk 'NF >= 6 && $6 ~ /\.so/ { print $6 }' "/proc/$host_pid/maps" | sort -u)"
          echo '--- shared libraries the installed host has mapped ---'
          echo "$libs"
          for lib in libespeak-ng.so.1 libonnxruntime.so; do
            if ! printf '%s\n' "$libs" | grep -qx "/usr/lib/kokoro-kindle-reader/$lib"; then
              echo "FAIL: the installed host did not load /usr/lib/kokoro-kindle-reader/$lib" >&2
              exit 1
            fi
          done
          kill "$runuser_pid" 2>/dev/null || true

      # Complete corresponding source (GPLv3 section 6) for this package, from this job's own
      # build and provenance - the strict release proof on a v* tag, a NON-RELEASE-stamped
      # archive otherwise, since the upload below conveys the package either way.
      - name: Build corresponding source (release)
        if: startsWith(github.ref, 'refs/tags/v')
        run: as-builder python packaging/build_corresponding_source.py

      - name: Build corresponding source (non-release)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: as-builder python packaging/build_corresponding_source.py --allow-uncommitted

      # Never the package alone: it and its source travel as one artifact.
      - name: Upload package + corresponding source
        uses: actions/upload-artifact@v7
        with:
          name: kokoro-kindle-reader-arch-bundle
          path: |
            packaging/dist/*.pkg.tar.xz
            packaging/dist/corresponding-source-*-arch.zip
          if-no-files-found: error
