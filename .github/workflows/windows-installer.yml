name: windows installer (kokoro-host + panel)

# Builds the installer: the tray host (kokoro-host) + the Slint settings panel
# (kokoro-panel) + the native Dawn WebGPU runtime + the x86 KokoroSapi.dll (Rust),
# packaged by packaging/build_installer.py (makensis). This is the only edition now
# (the old Tauri/WebView2 build is retired), so it owns the vX.Y.Z release tags.
# Windows-only. The synth runtime deps are provisioned by fetch-deps.py (the
# onnxruntime-webgpu wheel for the Dawn runtime DLLs + an espeak-ng x64 build). The Cloud
# Reader OCR models are NOT bundled - the app downloads them at first run - so they are not
# provisioned here. The synth core is pure Rust; onnxruntime.dll is loaded at runtime via
# the `ort` crate, by both the synth and the OCR.
#
# Three events, one build. A v* tag is a RELEASE: the strict corresponding-source proof, then
# a draft GitHub Release (the `release` job). A push to main that touches anything the
# installer is built from runs the same build as a CHECK, so a broken packaging script is
# found at the commit that broke it rather than at the next tag. That is not hypothetical:
# this workflow used to run on tags only, and the whole Python port of the packaging scripts
# landed without one run of it. A manual dispatch is the same check on demand. Non-tag runs
# still upload their installer, paired with a source archive stamped NON-RELEASE.

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: [main]
    # Applies to the branch pushes only: GitHub does not evaluate path filters for a tag
    # push, so every v* tag still builds a release.
    paths:
      - 'kokoro-host/**'
      - 'kokoro-panel/**'
      - 'kokoro-sapi/**'
      - 'kokoro-hook/**'
      - 'kokoro-inject/**'
      - 'kokoro-protocol/**'
      - 'kokoro-ocr/**'
      - 'native-deps/*.py'
      - 'packaging/**'
      - '!packaging/linux/**'
      - 'licenses/**'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - 'legal.html'
      - 'legal.rs'
      - 'icons/**'
      - 'model-manifest.json'
      - 'ocr-manifest.json'
      - '.github/workflows/windows-installer.yml'

# Read-only for the build, which runs third-party build scripts (every crate's build.rs) and
# must not hold a token that can write to the repository. The `release` job alone gets
# contents: write, and only on a tag.
permissions:
  contents: read

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true # icons/icon.ico is in Git LFS (bundled + shortcut icon)

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc # the x86 SAPI DLL (kokoro-sapi)
          # The release archive carries the exact standard-library source linked into all
          # five Rust outputs; cargo-about cannot see code supplied by the rustc sysroot.
          components: rust-src

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            kokoro-host
            kokoro-panel
            kokoro-sapi
            kokoro-hook
            kokoro-inject

      # NSIS is PINNED: the installer/uninstaller stub is NSIS, so its version is part of
      # what we ship (its COPYING is staged into licenses\nsis\ from this exact toolchain -
      # see build_installer.py). Bump this in lockstep when intentionally upgrading NSIS;
      # the value must be a version the choco `nsis` package actually publishes.
      - name: Install NSIS (pinned)
        run: choco install nsis --version=3.12.0 -y --no-progress

      # cargo-about generates the Rust dependency-licence notices and, via `--fail`, is the
      # gate that refuses a dependency under a licence not in packaging\about.toml. Without
      # it here, build_installer.py -> generate_dependency_licenses.py THROWS, so this is
      # a build-breaking prerequisite, not only a compliance step. Pinned so the closure
      # notices are reproducible; --features cli matches how the tool is normally installed.
      - name: Install cargo-about (pinned)
        run: cargo install cargo-about --version 0.9.1 --locked --features cli

      # The provisioning recipe is one shared Python script for Windows and Linux, and the
      # whole packaging chain below is Python too - so this is a hard prerequisite, not a
      # convenience. windows-latest happens to ship a Python, but pin one rather than depend
      # on a runner image: this is the release path, and "the image changed" is not a failure
      # anyone wants to diagnose from a tagged build.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Provision native-deps/: the Dawn runtime DLLs (from the exact hash-pinned
      # onnxruntime-webgpu cp312 wheel) + an espeak-ng x64 build. Downloads + a build;
      # the slowest step.
      - name: Provision native deps (ORT runtime + espeak)
        run: python native-deps/fetch-deps.py

      # The Cloud Reader OCR models are NOT bundled - the panel downloads them at first run
      # (see ocr-manifest.json / kokoro-panel::download), so the installer build does not need
      # them and no OCR provisioning step runs here.

      # Build the x86 Rust SAPI DLL + release-build both crates, stage, run makensis.
      - name: Build installer
        run: python packaging/build_installer.py

      # Prove the installer actually CONTAINS the licence/notice tree (GPLv3 requires the
      # notices accompany the binaries). Extracts the produced -setup.exe and fails if any
      # required notice is missing or empty - same "fail loudly" contract as the OCR digests.
      - name: Verify installer notices
        run: python packaging/verify_installer_notices.py

      # Complete corresponding source (GPLv3 section 6) for the GPL-covered binaries.
      # A tag build must satisfy the strict clean+matching-tag proof. A non-tag build (a push
      # to main, or a manual run) is not a release, but upload-artifact still conveys its
      # installer, so pair it with a source archive from the same checkout and stamp that
      # archive NON-RELEASE.
      - name: Build corresponding source (release)
        if: startsWith(github.ref, 'refs/tags/v')
        run: python packaging/build_corresponding_source.py

      - name: Build corresponding source (manual CI artifact)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: python packaging/build_corresponding_source.py --allow-uncommitted

      # Never upload the GPL-covered installer as a standalone Actions artifact. This runs on
      # every event - a push or a manual run has no GitHub Release to pair the source with -
      # and on a tag it is also what the `release` job publishes from.
      - name: Upload installer + corresponding source
        uses: actions/upload-artifact@v7
        with:
          name: kokoro-kindle-reader-bundle
          path: |
            packaging/dist/*-setup.exe
            packaging/dist/corresponding-source-*.zip
          if-no-files-found: error

  # On a v* tag, publish a draft GitHub Release from the bundle the build uploaded - the same
  # bytes, not a rebuild. A job of its own so that publishing is the only thing that ever holds
  # contents: write.
  release:
    name: Publish draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: kokoro-kindle-reader-bundle
          path: dist

      # Release title: match the existing "kokoro-kindle-reader vX.Y.Z" convention
      # (strip the leading v from the tag).
      - name: Compose release title
        id: relname
        run: echo "title=kokoro-kindle-reader v${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Attach BOTH the installer and the corresponding-source archive: the GPL-covered
      # binaries must be conveyed with their complete corresponding source from the same place
      # (GPLv3 section 6(d)). fail_on_unmatched_files, so a bundle missing either is an error
      # rather than a release with one attachment.
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          files: |
            dist/*-setup.exe
            dist/corresponding-source-*.zip
          draft: true
          name: ${{ steps.relname.outputs.title }}
          body: |
            WebView2-free edition of Kokoro Kindle Reader — a headless tray host
            (native Dawn WebGPU synthesis) + a native Slint settings panel.
            Bundles the "Kokoro (SAPI5)" x86 engine so Kindle for PC can narrate.

            The Kokoro model downloads on first run (open Settings from the tray).
            The app must stay running (tray) for Kindle to speak.

            ---
            **Licensing.** The installed application is conveyed under **GPL-3.0-only**
            (it links modified espeak-ng and Slint). Complete corresponding source for the
            GPL-covered binaries is the `corresponding-source-*.zip` attached to this
            release; the licence notices ship inside the installer. See `LICENSING.md` and
            `THIRD_PARTY_NOTICES.md` in the source for the full breakdown.

            **Building from source** (including from that archive) now also needs
            **Python 3**: the native-dependency provisioning is a Python script, shared with
            the in-progress Linux port. Any Python 3 will do. It is *not* needed to install
            or run the app — the installer bundles everything.
