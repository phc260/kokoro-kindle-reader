# The tools doctor.cmd and doctor.sh check, one per line, in the order they are reported
# (install order: on a fresh machine each is needed before the next).
#
#   id|name|version|level|windows fix|linux fix
#
# id       names the detector in both scripts (:detect_<id> / detect_<id>)
# version  - (presence only), >=X[.Y[.Z]] or =X[.Y[.Z]]; each part below 1000
# level    required, or optional (reported as [!] and never fails the run)
# fix      shown when the tool is missing or too old; - means that platform does not use it
#
# No spaces around '|', no '|' or '!' inside a field, and '-' rather than an empty field
# (batch's for /f merges empty fields). Keep this file LF (.gitattributes pins it).
git|Git|-|required|install from https://git-scm.com/download/win|install git
git_lfs|Git LFS|-|required|install Git LFS, then: git lfs install, git lfs pull|install git-lfs, then: git lfs install, git lfs pull
msvc|MSVC|-|required|install VS Build Tools with 'Desktop development with C++'|-
cc|C/C++ toolchain|-|required|-|install gcc, g++ and make (e.g. build-essential)
cmake|CMake|-|required|winget install Kitware.CMake|install cmake
python|Python|>=3.12|required|install from https://www.python.org/downloads/ (tick 'Add to PATH')|install python3
rust|Rust|-|required|install from https://rustup.rs|install from https://rustup.rs
rust_x86|Rust x86 target|-|required|rustup target add i686-pc-windows-msvc|-
rust_src|rust-src|-|required|rustup component add rust-src|-
nsis|NSIS|=3.12|required|choco install nsis --version=3.12.0 -y --force|-
cargo_about|cargo-about|>=0.9.0|required|cargo install cargo-about --locked --features cli|-
seven_zip|7-Zip|-|optional|choco install 7zip -y (only needed to verify a built installer)|-
bun|bun|>=1.4.0|required|install from https://bun.sh|install from https://bun.sh
